name: Build and deploy

env:
  HUGO_VERSION: 0.168.0
  TZ: Asia/Shanghai

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      # Stack 主题的 style.html 用 `toCSS` 且未指定 transpiler，走的是 libsass
      # （Hugo extended 内置）。2026-10-28 用 CSS 指纹比对确认：加装 Dart Sass 后
      # 产物完全没变，那一步纯空转 + 一个额外失败点，已删除。
      # 等主题迁到 dartsass（libsass 已被 Hugo 0.153 弃用）时，再把安装步骤加回来，
      # 注意 tar 解出来是 dart-sass/dart-sass/sass，PATH 要指到里层目录。
      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Log tool versions
        run: |
          hugo version
          hugo env

      - name: Build
        run: |
          hugo build \
            --gc \
            --minify \
            --baseURL "https://11os.github.io/" \
            --cacheDir "${{ runner.temp }}/.cache/hugo"

      - name: Prepare nojekyll
        run: |
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5